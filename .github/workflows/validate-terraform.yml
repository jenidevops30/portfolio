name: Terraform CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/validate-terraform.yml"

  push:
    branches:
      - main
      - feature/phase-1-portfolio-foundation
    paths:
      - "terraform/**"
      - ".github/workflows/validate-terraform.yml"

permissions:
  contents: read

concurrency:
  group: terraform-portfolio
  cancel-in-progress: false

jobs:
  validate:
    name: Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Terraform Plan
    needs: validate
    # Fork PRs are excluded. The plan role trust policy separately restricts
    # push/dispatch OIDC tokens to main and the feature foundation branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Verify AWS Terraform plan role secret is available
        env:
          AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$AWS_TERRAFORM_PLAN_ROLE_ARN" ]; then
            echo "::error::AWS_TERRAFORM_PLAN_ROLE_ARN is missing. Set it to the output github_actions_terraform_plan_role_arn."
            exit 1
          fi
          echo "AWS Terraform plan role secret is available."

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m
