name: Deploy Portfolio to S3 + CloudFront

on:
  push:
    branches:
      - v2

jobs:
  deploy:
    name: Build & Deploy Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          echo "📦 Installing npm dependencies..."
          npm ci

      - name: Build React Application
        run: |
          echo "⚡ Compiling React app with Vite..."
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          echo "🚀 Syncing dist/ folder to S3 bucket (jeni-portfolio)..."
          aws s3 sync dist/ s3://jeni-portfolio --delete
          echo "✅ S3 sync complete → s3://jeni-portfolio"

      - name: Invalidate CloudFront Cache
        run: |
          echo "🔄 Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "✅ CloudFront cache invalidated"

      - name: Deployment Summary
        run: |
          echo "=================================================="
          echo "🚀 Portfolio deployed successfully!"
          echo "🌐 Live URL: https://jenidevops.in"
          echo "📦 Target S3: s3://jeni-portfolio"
          echo "=================================================="
