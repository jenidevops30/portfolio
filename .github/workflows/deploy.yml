name: Deploy Portfolio to S3 + CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Deploy to S3 & Invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node for the Vite build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Install deps and build the React/Vite app
      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 3b. Lint code (quality gate)
      - name: ESLint Code Quality
        working-directory: frontend
        run: npm run lint
        continue-on-error: false

      # 3c. Security scan - Check for vulnerable dependencies
      - name: Security Scan - Snyk Dependencies
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high frontend/
        continue-on-error: true

      # 3d. Performance audit - Lighthouse CI
      - name: Performance Audit - Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

      # 4. Configure AWS credentials from GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. Sync the built app (frontend/dist) to S3
      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist s3://jeni-portfolio --delete
          echo "✅ S3 sync complete → s3://jeni-portfolio"

      # 4. Invalidate CloudFront cache so changes go live immediately
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "✅ CloudFront cache invalidated → https://d3n8nd35qm5vvz.cloudfront.net"

      # 5. Print live URL in the Actions log
      - name: Deployment Summary
        run: |
          echo "🚀 Portfolio deployed successfully!"
          echo "🌐 Live URL: https://d3n8nd35qm5vvz.cloudfront.net"
