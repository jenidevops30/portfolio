AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless contact enquiry API for the portfolio.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://jenidevops.in
    Description: Exact browser origin allowed to call the API.
  NotificationEmail:
    Type: String
    Description: Gmail inbox that receives portfolio enquiry notifications.
  SesFromEmail:
    Type: String
    Description: Verified SES sender identity in the deployment region.
  RetentionDays:
    Type: Number
    Default: 180
    MinValue: 30
    MaxValue: 730

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Tracing: Active

Resources:
  ContactApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'POST,OPTIONS'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5

  EnquiriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: enquiryId
          AttributeType: S
      KeySchema:
        - AttributeName: enquiryId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref EnquiriesTable
          NOTIFICATION_EMAIL: !Ref NotificationEmail
          SES_FROM_EMAIL: !Ref SesFromEmail
          RETENTION_DAYS: !Ref RetentionDays
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EnquiriesTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        SubmitEnquiry:
          Type: Api
          Properties:
            RestApiId: !Ref ContactApi
            Path: /enquiries
            Method: POST

Outputs:
  ContactApiUrl:
    Description: Set this value as VITE_CONTACT_API_URL in the frontend build environment.
    Value: !Sub "https://${ContactApi}.execute-api.${AWS::Region}.amazonaws.com/prod/enquiries"
  EnquiriesTableName:
    Value: !Ref EnquiriesTable
